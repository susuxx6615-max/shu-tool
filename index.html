<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排班表</title>
<style>
:root{
  --paper:#FAFAF8;
  --panel:#FFFFFF;
  --ink:#151A21;
  --ink-soft:#3C4450;
  --muted:#6C7480;
  --rule:#E3E5E9;
  --rule-strong:#BEC3CC;
  --indigo:#26418F;
  --sat:#F1F3F7;
  --sun:#FBF2F1;
  --today:#FFF6E0;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono",monospace;
  --zoom:1;
}
:root[data-zoom="1.25"]{--zoom:1.25}
:root[data-zoom="1.5"]{--zoom:1.5}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-size:calc(14px*var(--zoom));line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* ---------- chrome ---------- */
.bar{
  position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--rule);
}
.bar-in{
  max-width:1400px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);
}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .ym{
  font-family:var(--mono);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:118px;text-align:center;
}
.icon-btn{
  width:30px;height:30px;border:1px solid var(--rule-strong);background:var(--panel);
  border-radius:4px;color:var(--ink-soft);line-height:1;font-size:14px;
}
.icon-btn:hover{border-color:var(--indigo);color:var(--indigo)}
.spacer{flex:1}
.btn{
  border:1px solid var(--rule-strong);background:var(--panel);border-radius:4px;
  padding:6px 12px;font-size:calc(13px*var(--zoom));color:var(--ink-soft);
}
select.btn{appearance:auto;padding:5px 8px}
.btn:hover{border-color:var(--indigo);color:var(--indigo)}
.btn-solid{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn-solid:hover{background:#1c3372;color:#fff}
.btn-quiet{border-color:transparent;color:var(--muted)}
.btn-quiet:hover{border-color:var(--rule-strong)}

/* ---------- brush palette ---------- */
.palette{
  max-width:1400px;margin:0 auto;padding:12px 16px 4px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.palette .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-right:2px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 7px;
  border:1px solid var(--rule-strong);border-radius:999px;background:var(--panel);
  font-size:calc(13px*var(--zoom));transition:box-shadow .12s,border-color .12s;
}
.chip .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.12);
  display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700}
.chip .kbd{font-family:var(--mono);font-size:10px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset,0 1px 0 rgba(0,0,0,.04)}
.chip[aria-pressed="true"] .kbd{color:var(--ink)}
.help-btn{margin-left:4px}

/* ---------- start card ---------- */
.start{max-width:600px;margin:8px auto;padding:26px 8px 34px;text-align:left}
.start h3{margin:0 0 4px;font-size:17px;font-weight:600;text-align:center}
.start .sub{margin:0 0 22px;font-size:13px;color:var(--muted);text-align:center}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{
  counter-increment:s;display:grid;grid-template-columns:30px 1fr auto;gap:4px 14px;
  align-items:start;padding:14px 0;border-top:1px solid var(--rule);
}
ol.steps li::before{
  content:counter(s,decimal-leading-zero);grid-row:1/3;
  font-family:var(--mono);font-size:12px;color:var(--indigo);letter-spacing:.06em;padding-top:2px;
}
ol.steps b{font-size:14px;font-weight:600}
ol.steps span{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.55}
ol.steps button{grid-row:1/3;align-self:center;white-space:nowrap}

/* ---------- help ---------- */
.guide{margin:0;padding:0;list-style:none;counter-reset:g}
.guide li{counter-increment:g;display:grid;grid-template-columns:26px 1fr;gap:3px 12px;padding:11px 0;border-bottom:1px dotted var(--rule)}
.guide li::before{content:counter(g,decimal-leading-zero);grid-row:1/3;font-family:var(--mono);font-size:11px;color:var(--indigo);padding-top:3px}
.guide b{font-size:13.5px;font-weight:600}
.guide span{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.6}
table.keys{width:100%;border-collapse:collapse;margin-top:4px}
table.keys td{padding:6px 0;border-bottom:1px dotted var(--rule);font-size:12.5px;vertical-align:top}
table.keys td:first-child{width:126px;color:var(--ink-soft)}
kbd{
  font-family:var(--mono);font-size:11px;background:#F2F3F6;border:1px solid var(--rule-strong);
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink-soft);
}

/* ---------- sheet ---------- */
.sheet-wrap{max-width:1400px;margin:10px auto 60px;padding:0 16px}
.sheet{background:var(--panel);border:1px solid var(--rule);padding:16px 18px 18px}
.sheet-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.unit{
  border:none;border-bottom:1px dashed var(--rule-strong);background:transparent;
  font-size:calc(15px*var(--zoom));font-weight:600;padding:2px 2px 3px;min-width:180px;
}
.unit:focus{outline:none;border-bottom-color:var(--indigo)}
.sheet-title{
  font-family:var(--mono);font-size:calc(22px*var(--zoom));font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}
.sheet-meta{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);font-family:var(--mono)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 10px;font-size:calc(11px*var(--zoom));color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.15);display:inline-block}

.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;table-layout:fixed;width:100%;min-width:900px}
table.grid th,table.grid td{border:1px solid var(--rule);padding:0;text-align:center}
table.grid thead th{
  background:#F7F8FA;font-weight:600;font-size:calc(11px*var(--zoom));color:var(--ink-soft);
  position:sticky;top:0;z-index:5;
}
th.c-name,td.c-name{
  width:calc(112px*var(--zoom));text-align:left;padding:3px 8px;position:sticky;left:0;background:var(--panel);z-index:6;
  border-right:1px solid var(--rule-strong);
}
thead th.c-name{background:#F7F8FA;z-index:7}
tbody td.c-name{cursor:pointer}
tbody td.c-name:hover .nm{color:var(--indigo);text-decoration:underline}
td.c-name .nm{font-size:calc(13px*var(--zoom));line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.c-name .no{font-size:calc(10px*var(--zoom));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th.c-day{width:calc(30px*var(--zoom))}
th.c-day .d{font-family:var(--mono);font-size:calc(12px*var(--zoom));font-variant-numeric:tabular-nums;display:block;line-height:1.2}
th.c-day .w{font-size:calc(9px*var(--zoom));color:var(--muted);display:block;line-height:1.2}
th.c-sum,td.c-sum{width:calc(38px*var(--zoom));border-left:1px solid var(--rule-strong);font-family:var(--mono);font-size:calc(12px*var(--zoom));font-variant-numeric:tabular-nums}
td.c-sum{color:var(--ink-soft)}
td.cell{height:calc(26px*var(--zoom));cursor:cell;user-select:none;position:relative}
td.cell:hover{box-shadow:0 0 0 2px var(--indigo) inset}
/* 單日例外時間的角標 */
td.cell.ovr::after{
  content:'';position:absolute;top:0;right:0;width:0;height:0;
  border:calc(4px*var(--zoom)) solid transparent;
  border-top-color:rgba(21,26,33,.6);border-right-color:rgba(21,26,33,.6);
}
.sat{background:var(--sat)}
.sun{background:var(--sun)}
.today{box-shadow:inset 0 2px 0 #E8A33D}
.mark{
  display:block;height:100%;width:100%;font-family:var(--mono);font-size:calc(11px*var(--zoom));font-weight:700;
  line-height:calc(26px*var(--zoom));letter-spacing:.02em;
}
tfoot td{background:#F7F8FA;font-family:var(--mono);font-size:calc(11px*var(--zoom));font-variant-numeric:tabular-nums;color:var(--ink-soft);height:calc(22px*var(--zoom))}
tfoot td.c-name{background:#F7F8FA;font-family:var(--ui);font-size:calc(11px*var(--zoom));color:var(--muted);font-weight:600}
.fi{width:9px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,.15);display:inline-block;margin-right:4px;vertical-align:-1px}
tfoot tr.total td{border-top:1px solid var(--rule-strong)}
tbody tr:nth-child(even) td.cell:not(.sat):not(.sun){background:#FCFCFD}

.empty{padding:44px 16px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px;font-size:13px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(21,26,33,.42);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--rule-strong);width:min(660px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.modal header h2{margin:0;font-size:15px;font-weight:600}
.modal .body{padding:14px 18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center}
.row{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--rule)}
.row input[type=text]{border:1px solid var(--rule);border-radius:3px;padding:5px 7px;min-width:0}
.row input[type=number]{border:1px solid var(--rule);border-radius:3px;padding:5px 7px;width:64px;font-family:var(--mono)}
.row input[type=color]{width:34px;height:30px;border:1px solid var(--rule);border-radius:3px;padding:2px;background:var(--panel)}
.row .grow{flex:1}
.row .code{width:52px;text-align:center;font-family:var(--mono);font-weight:700}
.row .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:22px;text-align:right}
.row label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mini{width:26px;height:26px;border:1px solid var(--rule);background:var(--panel);border-radius:3px;font-size:12px;color:var(--muted);line-height:1}
.mini:hover{border-color:var(--indigo);color:var(--indigo)}
.mini.danger:hover{border-color:#B4232A;color:#B4232A}
.field{margin-top:16px}
.field h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.field p{margin:0 0 8px;font-size:12px;color:var(--muted)}
textarea{width:100%;border:1px solid var(--rule);border-radius:3px;padding:8px;min-height:88px;resize:vertical}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;z-index:80;
}

/* ---------- personal card ---------- */
.modal.wide{width:min(940px,100%)}
.card-cols{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.card-cal{flex:1 1 340px;min-width:300px}
.card-ref{flex:1 1 280px;min-width:240px}
.card-ref img{width:100%;border:1px solid var(--rule);border-radius:3px;display:block}
.card-ref .hint{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .hd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:600}
.cal .dy{
  border:1px solid var(--rule);border-radius:3px;background:var(--panel);
  min-height:46px;padding:3px 4px;text-align:left;position:relative;
}
.cal .dy.pad{border-color:transparent;background:transparent;cursor:default}
.cal .dy .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .dy .cd{
  display:block;margin-top:3px;border-radius:3px;font-size:12px;font-weight:700;
  text-align:center;line-height:20px;font-family:var(--mono);
}
.cal .dy:not(.pad):hover{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.cal .dy.wk .n{color:#B4232A}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 0;font-size:12.5px}
.stats b{font-family:var(--mono);font-size:15px;font-weight:700}
.pay{margin-top:12px;padding:11px 12px;background:#F7F8FA;border:1px solid var(--rule);border-radius:4px}
.pay .ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pay input{border:1px solid var(--rule);border-radius:3px;padding:5px 7px;width:92px;font-family:var(--mono)}
.pay .amt{margin-left:auto;font-family:var(--mono);font-size:20px;font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums}
.pay .note{margin:6px 0 0;font-size:11.5px;color:var(--muted)}
.card-brush{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.card-brush .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
/* 月曆格裡的時間列：點它會開時間設定，不會塗到班別 */
.cal .dy .tm{
  display:block;margin-top:2px;font-family:var(--mono);font-size:9.5px;line-height:1.3;
  color:var(--muted);border-radius:2px;padding:1px 0;
}
.cal .dy .tm:hover{background:#EDF0F7;color:var(--indigo)}
.cal .dy .tm.ov{color:var(--indigo);font-weight:700}

/* ---------- 時間設定小視窗（疊在個人卡之上） ---------- */
.pop-back{position:fixed;inset:0;background:rgba(21,26,33,.3);display:grid;place-items:center;z-index:60;padding:16px}
.pop{background:var(--panel);border:1px solid var(--rule-strong);border-radius:4px;width:min(390px,100%);padding:14px 16px 12px;box-shadow:0 8px 28px rgba(21,26,33,.18)}
.pop h3{margin:0 0 2px;font-size:14px;font-weight:600}
.pop .who{margin:0 0 11px;font-size:12px;color:var(--muted)}
.pop .tl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pop .tl label{font-size:12px;color:var(--muted)}
.pop input[type=time]{border:1px solid var(--rule);border-radius:3px;padding:5px 6px;font-family:var(--mono)}
.pop input[type=number]{border:1px solid var(--rule);border-radius:3px;padding:5px 6px;width:62px;font-family:var(--mono)}
.pop .calc{margin:0 0 12px;font-size:12.5px;color:var(--ink-soft)}
.pop .calc b{font-family:var(--mono);font-size:15px}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pop .acts .btn{padding:5px 10px;font-size:12.5px}

/* ---------- 班別設定的時間欄位 ---------- */
.row.sh{flex-wrap:wrap}
.row.sh .tg{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.row.sh .tg input[type=time]{border:1px solid var(--rule);border-radius:3px;padding:4px 6px;font-family:var(--mono);font-size:12px}
.row.sh .tg input[type=number]{width:56px}
.row.sh .hv{font-family:var(--mono);font-size:12px;color:var(--ink-soft);min-width:52px}
.emp-times{margin-top:12px}
.emp-times summary{font-size:12px;color:var(--ink-soft);cursor:pointer;font-weight:600}
.emp-times .er{display:flex;gap:7px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--rule);font-size:12px;flex-wrap:wrap}
.emp-times .er .nm2{min-width:64px;color:var(--ink-soft)}
.emp-times input[type=time]{border:1px solid var(--rule);border-radius:3px;padding:4px 6px;font-family:var(--mono);font-size:12px}
.emp-times input[type=number]{border:1px solid var(--rule);border-radius:3px;padding:4px 6px;width:56px;font-family:var(--mono);font-size:12px}
.emp-times .hint2{margin:7px 0 0;font-size:11.5px;color:var(--muted)}

@media (max-width:640px){
  .sheet{padding:12px}
  .sheet-wrap{padding:0 8px}
}

/* ---------- print ---------- */
@media print{
  @page{size:A4 landscape;margin:8mm}
  /* 列印一律回到標準字級，維持 A4 一頁的版面 */
  :root[data-zoom]{--zoom:1}
  html,body{background:#fff}
  .no-print{display:none!important}
  .sheet-wrap{max-width:none;margin:0;padding:0}
  .sheet{border:none;padding:0}
  .scroll{overflow:visible}
  table.grid{min-width:0;width:100%}
  table.grid thead th{position:static}
  th.c-name,td.c-name,thead th.c-name,tfoot td.c-name{position:static}
  .sheet-title{font-size:15pt}
  .unit{font-size:11pt;border-bottom:none}
  .sheet-meta{font-size:7pt}
  .legend{font-size:7.5pt;gap:9px;margin-bottom:6px}
  th.c-name,td.c-name{width:22mm;padding:1px 4px}
  td.c-name .nm{font-size:8pt}
  td.c-name .no{font-size:6pt}
  th.c-day .d{font-size:7.5pt}
  th.c-day .w{font-size:6pt}
  th.c-sum,td.c-sum{width:8mm;font-size:7.5pt}
  td.cell{height:5.2mm}
  .mark{font-size:7.5pt;line-height:5.2mm}
  tfoot td{height:5mm;font-size:7pt}
  tbody tr:nth-child(even) td.cell:not(.sat):not(.sun){background:#fff}
  tbody td.c-name{cursor:default}
  td.cell:hover{box-shadow:none}
  .today{box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<div class="bar no-print">
  <div class="bar-in">
    <span class="eyebrow">排班 / ROSTER</span>
    <div class="stepper">
      <button class="icon-btn" id="prev" title="上個月">‹</button>
      <span class="ym" id="ym">—</span>
      <button class="icon-btn" id="next" title="下個月">›</button>
      <button class="btn btn-quiet" id="today-btn">本月</button>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="open-staff">員工</button>
    <button class="btn" id="open-shifts">班別</button>
    <button class="btn" id="copy-prev">套用上月</button>
    <select class="btn" id="zoom" title="畫面字體大小" aria-label="畫面字體大小">
      <option value="1">字級：標準</option>
      <option value="1.25">字級：大</option>
      <option value="1.5">字級：特大</option>
    </select>
    <button class="btn" id="save-file" title="把資料存回這個 HTML 檔">儲存檔案</button>
    <button class="btn btn-solid" id="print">列印班表</button>
    <button class="icon-btn help-btn" id="help" title="使用說明">？</button>
  </div>
</div>

<div class="palette no-print" id="palette"></div>

<div class="sheet-wrap">
  <div class="sheet" id="sheet">
    <div class="sheet-head">
      <input class="unit" id="unit" placeholder="單位名稱" aria-label="單位名稱">
      <div class="sheet-title" id="sheet-title">—</div>
      <div class="sheet-meta" id="sheet-meta"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="scroll" id="scroll"></div>
  </div>
</div>

<script>
const KEY = 'roster:data:v1';
const WD = ['日','一','二','三','四','五','六'];
const PRESET = ['#F6C445','#7FB2E5','#8FCF9A','#E7907C','#B7A5E0','#9AD3D0','#E4B7CB','#C9CBD1'];

let state = null, ym = null, brush = null, painting = false, saveTimer = null;

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const mk = (y, m) => y + '-' + String(m + 1).padStart(2, '0');
// 用 UTC 推算，星期與天數不受使用者時區或日光節約影響
const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
const dow = (y, m, d) => new Date(Date.UTC(y, m, d)).getUTCDay();

const ZOOMS = [1, 1.25, 1.5];
function seed() {
  return {
    unit: '',
    zoom: 1,
    baseWage: 0,
    savedAt: 0,
    employees: [],
    shifts: [
      { id: uid(), code: '早', name: '早班', color: '#F6C445', start: '08:00', end: '16:00', brk: 0, hours: 8, count: true },
      { id: uid(), code: '中', name: '中班', color: '#7FB2E5', start: '14:00', end: '22:00', brk: 0, hours: 8, count: true },
      { id: uid(), code: '晚', name: '晚班', color: '#B7A5E0', start: '22:00', end: '06:00', brk: 0, hours: 8, count: true },

}

/* ---------- storage ----------
   Claude 環境提供 window.storage；放到 GitHub Pages 等一般網頁時
   自動改用瀏覽器內建儲存，資料存在該台電腦的這個瀏覽器裡。      */
const hasHost = typeof window.storage?.get === 'function';
const store = {
  async get(k) {
    if (hasHost) return await window.storage.get(k);
    const v = localStorage.getItem(k);
    return v ? { key: k, value: v } : null;
  },
  async set(k, v) { return hasHost ? window.storage.set(k, v) : localStorage.setItem(k, v); },
  async del(k) { return hasHost ? window.storage.delete(k) : localStorage.removeItem(k); }
};
async function load() {
  try {
    const r = await store.get(KEY);
    if (r && r.value) return JSON.parse(r.value);
  } catch (e) { /* 尚未存過或讀取失敗，用預設值開始 */ }
  return null;
}
/* 驗證並整理外部資料（匯入的備份檔、storage 讀回的舊資料）。
   結構不對回傳 null；順便丟掉空月份、無效班別/員工參照與非法色碼。 */
const HEX = /^#[0-9A-Fa-f]{6}$/;
function normBackup(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.shifts) || !Array.isArray(d.employees)) return null;
  const brkOf = v => Math.max(0, Math.min(720, Math.round(+v || 0)));
  const shifts = d.shifts.map(s => {
    if (!s || typeof s !== 'object' || s.id == null) return null;
    const start = normTime(s.start), end = normTime(s.end), brk = brkOf(s.brk);
    return {
      id: String(s.id),
      code: String(s.code ?? '班').slice(0, 2) || '班',
      name: String(s.name ?? '班別'),
      color: HEX.test(s.color) ? s.color : '#C9CBD1',
      start, end, brk,
      // 有起訖就以時間為準重算，時數欄永遠是這個班別的實際時數
      hours: (start && end) ? spanHours(start, end, brk) : Math.max(0, Math.min(24, +s.hours || 0)),
      count: s.count !== false
    };
  }).filter(Boolean);
  if (!shifts.length) shifts.push(...seed().shifts);
  const sids = new Set(shifts.map(s => s.id));
  // 個人固定時間：只留起訖都填、且班別還存在的
  const timesOf = t => {
    const out = {};
    if (t && typeof t === 'object') Object.entries(t).forEach(([sid, v]) => {
      if (!sids.has(sid) || !v || typeof v !== 'object') return;
      const start = normTime(v.start), end = normTime(v.end);
      if (start && end) out[sid] = { start, end, brk: brkOf(v.brk) };
    });
    return out;
  };
  const employees = d.employees.map(e => e && typeof e === 'object' && e.id != null && e.name != null ? {
    id: String(e.id), name: String(e.name), note: String(e.note ?? ''),
    wage: e.wage === '' || e.wage == null ? null : Math.max(0, Math.min(10000, +e.wage || 0)),
    times: timesOf(e.times)
  } : null).filter(Boolean);
  const eids = new Set(employees.map(e => e.id));
  const schedule = {};
  if (d.schedule && typeof d.schedule === 'object') {
    Object.entries(d.schedule).forEach(([mkey, mm]) => {
      if (!/^\d{4}-\d{2}$/.test(mkey) || !mm || typeof mm !== 'object') return;
      const em = {};
      Object.entries(mm).forEach(([eid, row]) => {
        if (!eids.has(eid) || !row || typeof row !== 'object') return;
        const rr = {};
        Object.entries(row).forEach(([day, v]) => {
          const dn = +day;
          if (dn < 1 || dn > 31) return;
          if (typeof v === 'string') { if (sids.has(v)) rr[dn] = v; return; }
          // 單日例外：起訖都成立才留物件，否則退回單純的班別 id
          if (!v || typeof v !== 'object' || !sids.has(v.s)) return;
          const st = normTime(v.st), en = normTime(v.en), br = brkOf(v.br);
          rr[dn] = (st && en) ? { s: String(v.s), st, en, br } : String(v.s);
        });
        if (Object.keys(rr).length) em[eid] = rr;
      });
      if (Object.keys(em).length) schedule[mkey] = em;
    });
  }
  return {
    unit: String(d.unit ?? ''),
    zoom: ZOOMS.includes(+d.zoom) ? +d.zoom : 1,
    baseWage: Math.max(0, Math.min(10000, +d.baseWage || 0)),
    savedAt: Math.max(0, +d.savedAt || 0),
    employees, shifts, schedule
  };
}
let dirty = false;
function save() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 350);
}
async function flushSave() {
  clearTimeout(saveTimer);
  if (!dirty) return;
  dirty = false;
  state.savedAt = Date.now();
  try { await store.set(KEY, JSON.stringify(state)); }
  catch (e) { dirty = true; toast('存不起來，這次的修改只留在畫面上'); }
}
// 關分頁或切到背景時立即寫入，避免 350ms 節流內的修改遺失
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- 單檔模式：把資料寫回 HTML ----------
   把目前的 state 內嵌成 <script id="roster-data">，產生一份完整的 HTML。
   支援 File System Access API 的瀏覽器（Chrome/Edge）可直接覆寫原檔，
   其他瀏覽器則下載新檔。                                        */
const DATA_ID = 'roster-data';
let fileHandle = null;
function embeddedData() {
  const el = document.getElementById(DATA_ID);
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}
function buildHTML() {
  const doc = document.documentElement.cloneNode(true);
  // 清掉執行時才產生的內容，讓檔案回到「乾淨模板 + 資料」的狀態
  doc.querySelectorAll('.overlay,.toast').forEach(n => n.remove());
  const sc = doc.querySelector('#scroll'); if (sc) sc.innerHTML = '';
  const pl = doc.querySelector('#palette'); if (pl) pl.innerHTML = '';
  const lg = doc.querySelector('#legend'); if (lg) lg.innerHTML = '';
  doc.removeAttribute('data-zoom');
  const u = doc.querySelector('#unit'); if (u) u.removeAttribute('value');
  let tag = doc.querySelector('#' + DATA_ID);
  if (!tag) {
    tag = document.createElement('script');
    tag.type = 'application/json'; tag.id = DATA_ID;
    // 必須排在主程式 script 之前，否則開機讀取時還沒被解析到
    const head = doc.querySelector('head');
    if (head) head.appendChild(tag);
    else doc.insertBefore(tag, doc.firstChild);
  }
  // 轉義 < 避免 JSON 內容意外結束 script 標籤
  tag.textContent = JSON.stringify({ ...state, savedAt: Date.now() }).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html>' + doc.innerHTML + '</html>';
}
function htmlName() {
  const n = new Date();
  const st = state.unit ? state.unit + '-' : '';
  return `排班表-${st}${n.getFullYear()}${String(n.getMonth() + 1).padStart(2, '0')}${String(n.getDate()).padStart(2, '0')}.html`;
}
function downloadHTML() {
  const blob = new Blob([buildHTML()], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = htmlName();
  a.click(); URL.revokeObjectURL(a.href);
}
async function saveToFile() {
  await flushSave();
  const canPick = typeof window.showSaveFilePicker === 'function';
  if (!canPick) { downloadHTML(); toast('這個瀏覽器不能直接覆寫檔案，已下載一份新檔'); return; }
  try {
    if (!fileHandle) {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: htmlName(),
        types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
      });
    }
    const w = await fileHandle.createWritable();
    await w.write(buildHTML());
    await w.close();
    toast('已存回檔案');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    fileHandle = null;
    downloadHTML(); toast('無法直接寫入，已改為下載一份新檔');
  }
}

/* ---------- 時間與時數 ----------
   時間分三層解析，每層都是「起訖都填才算數」，只取最先成立的那層：
     1. 單日例外  cell = {s, st, en, br}   ← 只有那一天
     2. 個人固定  emp.times[shiftId]        ← 那個人每次排這個班
     3. 班別預設  shift.start/end/brk       ← 全體通用
   三層都沒時間就用 shift.hours（相容舊資料與只想填時數的人）。 */
function toMin(t) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ''));
  if (!m) return null;
  const h = +m[1], mi = +m[2];
  return (h > 23 || mi > 59) ? null : h * 60 + mi;
}
const normTime = t => { const v = toMin(t); return v == null ? '' : String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0'); };
/* 跨夜（22:00→06:00）自動加一天；扣掉不給薪的休息分鐘 */
function spanHours(st, en, brk) {
  const a = toMin(st), b = toMin(en);
  if (a == null || b == null) return 0;
  let d = b - a;
  if (d <= 0) d += 1440;
  d -= Math.max(0, +brk || 0);
  return Math.max(0, Math.round(d / 60 * 100) / 100);
}
const fmtH = n => String(Math.round(n * 100) / 100);
const hasT = o => !!(o && o.start && o.end);
/* 格子可能是班別 id 字串，或帶單日時間的物件 */
const cellId = v => (typeof v === 'string' ? v : (v && typeof v === 'object' ? v.s : null));

/* ---------- helpers ---------- */
const shiftOf = id => state.shifts.find(s => s.id === id);
/* 解析一格：回傳班別、實際起訖、時數，以及時間是哪一層來的 */
function cellInfo(v, empId) {
  const id = cellId(v);
  const shift = id ? shiftOf(id) : null;
  if (!shift) return null;
  const ov = (v && typeof v === 'object') ? v : null;
  const pers = empId ? (empOf(empId)?.times || {})[id] : null;
  let start = '', end = '', brk = 0, from = 'shift';
  if (ov && ov.st && ov.en) { start = ov.st; end = ov.en; brk = +ov.br || 0; from = 'cell'; }
  else if (hasT(pers)) { start = pers.start; end = pers.end; brk = +pers.brk || 0; from = 'emp'; }
  else if (hasT(shift)) { start = shift.start; end = shift.end; brk = +shift.brk || 0; }
  const hours = start ? spanHours(start, end, brk) : (+shift.hours || 0);
  return { shift, id, start, end, brk, hours, from };
}
const timeTxt = i => i && i.start ? i.start + '–' + i.end : '';
function cellTitle(i, empName) {
  if (!i) return '雙擊可設定這天的時間';
  const t = timeTxt(i);
  return [empName, i.shift.name, t, fmtH(i.hours) + ' 小時',
    i.from === 'cell' ? '（這天的例外時間）' : (i.from === 'emp' ? '（個人固定時間）' : '')]
    .filter(Boolean).join(' · ');
}
/* 主表格子的樣式與內容，render() 與 setCell() 共用，避免兩邊長不一樣 */
function cellParts(v, empId, empName) {
  const i = cellInfo(v, empId);
  return {
    info: i,
    bg: i ? i.shift.color : '',
    ovr: !!(i && i.from === 'cell'),
    title: cellTitle(i, empName),
    inner: i ? `<span class="mark" style="color:${textOn(i.shift.color)}">${esc(i.shift.code)}</span>` : ''
  };
}
/* create=true 才建立本月的空物件；純瀏覽不在 schedule 累積空月份 */
function monthMap(create) {
  const k = mk(ym.y, ym.m);
  if (!state.schedule[k]) { if (!create) return {}; state.schedule[k] = {}; }
  return state.schedule[k];
}
function textOn(hex) {
  const c = hex.replace('#', '');
  const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 158 ? '#151A21' : '#fff';
}

/* ---------- palette ---------- */
function renderPalette() {
  const p = $('#palette');
  p.innerHTML = '<span class="lbl">筆刷</span>';
  state.shifts.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', brush === s.id);
    b.innerHTML = `<span class="sw" style="background:${esc(s.color)};color:${textOn(s.color)}">${esc(s.code)}</span>${esc(s.name)}${i < 9 ? `<span class="kbd">${i + 1}</span>` : ''}`;
    b.onclick = () => { brush = brush === s.id ? null : s.id; renderPalette(); };
    p.appendChild(b);
  });
  const e = document.createElement('button');
  e.className = 'chip';
  e.setAttribute('aria-pressed', brush === 'erase');
  e.innerHTML = '<span class="sw" style="background:#fff">✕</span>清除<span class="kbd">0</span>';
  e.onclick = () => { brush = brush === 'erase' ? null : 'erase'; renderPalette(); };
  p.appendChild(e);
}

/* ---------- grid ---------- */
function render() {
  const { y, m } = ym;
  $('#ym').textContent = `${y}年${m + 1}月`;
  $('#sheet-title').textContent = `${y} 年 ${m + 1} 月 排班表`;
  const now = new Date();
  $('#sheet-meta').textContent = `製表 ${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
  $('#unit').value = state.unit || '';

  $('#legend').innerHTML = state.shifts.map(s => {
    const t = hasT(s) ? ' · ' + esc(s.start + '–' + s.end) : '';
    return `<span><i style="background:${esc(s.color)}"></i>${esc(s.code)}　${esc(s.name)}${t}${s.hours ? ' · ' + esc(fmtH(s.hours)) + ' 小時' : ''}</span>`;
  }).join('');

  const scroll = $('#scroll');
  if (!state.employees.length) {
    scroll.innerHTML = `<div class="start no-print">
      <h3>三個步驟排完一個月</h3>
      <p class="sub">照順序做一次，之後每個月只要重複第 3 步。</p>
      <ol class="steps">

          <button class="btn btn-solid" onclick="openStaff()">加入員工</button></li>
        <li><b>設定班別</b><span>改成你們實際的班別名稱、顏色與時數。休假這類班別把「計入出勤」取消勾選。</span>
          <button class="btn" onclick="openShifts()">設定班別</button></li>
        <li><b>點格子排班</b><span>在上方選一個班別，然後在格子上點一下填入，按住拖曳可以連續填一整排。排好按「列印班表」。</span>
          <button class="btn" onclick="openHelp()">看完整說明</button></li>
      </ol></div>`;
    return;
  }

  const nd = daysIn(y, m);
  const map = monthMap();
  const isThis = now.getFullYear() === y && now.getMonth() === m;
  const useHours = state.shifts.some(s => +s.hours > 0);

  let h = '<table class="grid"><thead><tr><th class="c-name">姓名</th>';
  for (let d = 1; d <= nd; d++) {
    const w = dow(y, m, d);
    const cls = ['c-day', w === 6 ? 'sat' : '', w === 0 ? 'sun' : '', isThis && d === now.getDate() ? 'today' : ''].join(' ');
    h += `<th class="${cls}"><span class="d">${d}</span><span class="w">${WD[w]}</span></th>`;
  }
  h += '<th class="c-sum">天</th>' + (useHours ? '<th class="c-sum">時</th>' : '') + '</tr></thead><tbody>';

  const perDay = new Array(nd + 1).fill(0);
  state.employees.forEach(emp => {
    const row = map[emp.id] || {};
    let days = 0, hours = 0;
    h += `<tr><td class="c-name" data-emp="${emp.id}" title="點姓名開個人班表卡"><div class="nm">${esc(emp.name)}</div>${emp.note ? `<div class="no">${esc(emp.note)}</div>` : ''}</td>`;
    for (let d = 1; d <= nd; d++) {
      const w = dow(y, m, d);
      const p = cellParts(row[d], emp.id, emp.name);
      if (p.info && p.info.shift.count !== false) { days++; hours += p.info.hours; perDay[d]++; }
      const cls = ['cell', w === 6 ? 'sat' : '', w === 0 ? 'sun' : '', p.ovr ? 'ovr' : ''].join(' ');
      const style = p.bg ? ` style="background:${esc(p.bg)}"` : '';
      h += `<td class="${cls}" data-e="${emp.id}" data-d="${d}" title="${esc(p.title)}"${style}>${p.inner}</td>`;
    }
    h += `<td class="c-sum" data-sd="${emp.id}">${days || ''}</td>` + (useHours ? `<td class="c-sum" data-sh="${emp.id}">${hours ? fmtH(hours) : ''}</td>` : '') + '</tr>';
  });

  h += '</tbody><tfoot><tr class="total"><td class="c-name">出勤人數</td>';
  for (let d = 1; d <= nd; d++) h += `<td data-pc="${d}">${perDay[d] || ''}</td>`;
  h += '<td class="c-sum"></td>' + (useHours ? '<td class="c-sum"></td>' : '') + '</tr>';
  // 各班別每日人數；最右欄是該班別整月人次
  state.shifts.forEach(s => {
    let tot = 0;
    h += `<tr><td class="c-name"><i class="fi" style="background:${esc(s.color)}"></i>${esc(s.name)}</td>`;
    for (let d = 1; d <= nd; d++) {
      let n = 0;
      state.employees.forEach(emp => { if (cellId((map[emp.id] || {})[d]) === s.id) n++; });

  });
  h += '</tfoot></table>';

  scroll.innerHTML = h;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- painting ---------- */
/* 唯一的排班寫入點：主表與個人卡都呼叫這裡，兩邊看到的永遠是同一份資料。
   寫入後同步更新主表該格與統計，以及開啟中的個人卡。 */
/* time 給 {st,en,br} 就是這天的例外時間；沒給就用班別／個人的預設時間 */
function setCell(empId, day, shiftId, time) {
  const map = monthMap(true);
  if (!map[empId]) map[empId] = {};
  if (shiftId) {
    map[empId][day] = (time && time.st && time.en)
      ? { s: shiftId, st: time.st, en: time.en, br: Math.max(0, +time.br || 0) }
      : shiftId;
  } else delete map[empId][day];
  if (!Object.keys(map[empId]).length) delete map[empId];
  save();
  const td = document.querySelector(`td.cell[data-e="${empId}"][data-d="${day}"]`);
  if (td) {
    const p = cellParts(map[empId]?.[day], empId, empOf(empId)?.name);
    td.style.background = p.bg;
    td.classList.toggle('ovr', p.ovr);
    td.title = p.title;
    td.innerHTML = p.inner;
  }
  updateSums(empId, day);
  if (cardEmp === empId) renderCard();
}
function paint(td, clear) {
  const e = td.dataset.e, d = +td.dataset.d;
  if (!e) return;
  if (clear || brush === 'erase') setCell(e, d, null);
  else if (brush) setCell(e, d, brush);
}
function updateSums(e, d) {
  const map = monthMap();
  let days = 0, hours = 0;
  Object.values(map[e] || {}).forEach(v => {
    const i = cellInfo(v, e);
    if (i && i.shift.count !== false) { days++; hours += i.hours; }
  });
  const sd = document.querySelector(`[data-sd="${e}"]`);
  if (sd) sd.textContent = days || '';
  const sh = document.querySelector(`[data-sh="${e}"]`);
  if (sh) sh.textContent = hours ? fmtH(hours) : '';
  let n = 0;
  state.employees.forEach(emp => {
    const i = cellInfo(map[emp.id]?.[d], emp.id);
    if (i && i.shift.count !== false) n++;
  });
  const pc = document.querySelector(`[data-pc="${d}"]`);
  if (pc) pc.textContent = n || '';
  // 各班別統計：這一天每個班別的人數，以及各班別整月人次
  const cnt = {};
  state.employees.forEach(emp => {
    const id = cellId(map[emp.id]?.[d]);
    if (id) cnt[id] = (cnt[id] || 0) + 1;
  });
  const tots = {};
  Object.values(map).forEach(row => Object.values(row).forEach(v => {
    const id = cellId(v);
    if (id) tots[id] = (tots[id] || 0) + 1;
  }));
  state.shifts.forEach(s => {
    const c = document.querySelector(`[data-ps="${s.id}"][data-d="${d}"]`);
    if (c) c.textContent = cnt[s.id] || '';
    const t = document.querySelector(`[data-pst="${s.id}"]`);
    if (t) t.textContent = tots[s.id] || '';
  });
}
document.addEventListener('pointerdown', ev => {
  const nameTd = ev.target.closest('tbody td.c-name');
  if (nameTd && nameTd.dataset.emp) { openCard(nameTd.dataset.emp); return; }
  const td = ev.target.closest('td.cell');
  if (!td || ev.button === 2) return;
  if (!brush) { toast('先在上方選一個班別當筆刷'); return; }
  painting = ev.pointerType === 'mouse';
  paint(td);
});
document.addEventListener('pointermove', ev => {
  if (!painting) return;
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const td = el && el.closest ? el.closest('td.cell') : null;
  if (td) paint(td);
});
document.addEventListener('pointerup', () => painting = false);
document.addEventListener('contextmenu', ev => {
  const td = ev.target.closest('td.cell');
  if (!td) return;
  ev.preventDefault(); paint(td, true);
});
// 雙擊格子 → 設定這天的上下班時間
document.addEventListener('dblclick', ev => {
  const td = ev.target.closest('td.cell');
  if (!td || !td.dataset.e) return;
  ev.preventDefault();
  painting = false;
  openTimePop(td.dataset.e, +td.dataset.d);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (!closePop()) closeModal(); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (document.querySelector('.pop-back')) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
  // 優先用 ev.code 判斷實體按鍵：中文輸入法（注音/倉頡）開啟時 ev.key 會是
  // 'Process' 而不是數字，只看 ev.key 快捷鍵會完全沒反應；ev.code 不受影響，
  // 也順便支援數字鍵盤（Numpad）。少數虛擬鍵盤 ev.code 是空字串，再用 ev.key 備援。
  const m = /^(?:Digit|Numpad)(\d)$/.exec(ev.code);
  const n = m ? +m[1] : (/^[0-9]$/.test(ev.key) ? +ev.key : -1);
  if (n < 0) return;
  if (n === 0) brush = 'erase';
  else if (state.shifts[n - 1]) brush = state.shifts[n - 1].id;
  else return;
  renderPalette();
});

/* ---------- modals ---------- */
function closeModal() { closePop(); const o = document.querySelector('.overlay'); if (o) o.remove(); cardEmp = cardRef = null; }
function modal(title, bodyHTML, footerHTML) {
  closeModal();
  const o = document.createElement('div');
  o.className = 'overlay no-print';
  o.innerHTML = `<div class="modal"><header><h2>${title}</h2><span class="spacer" style="flex:1"></span>
    <button class="mini" data-close>✕</button></header>
    <div class="body">${bodyHTML}</div><footer>${footerHTML}</footer></div>`;
  o.addEventListener('click', ev => { if (ev.target === o || ev.target.dataset.close !== undefined) closeModal(); });
  document.body.appendChild(o);
  return o;
}

/* ---------- 時間設定小視窗 ----------
   從主表雙擊格子、或個人卡點時間列打開。疊在個人卡之上，關掉不影響卡片。 */
function closePop() { const p = document.querySelector('.pop-back'); if (p) { p.remove(); return true; } return false; }
function openTimePop(empId, day) {
  closePop();
  const emp = empOf(empId);
  if (!emp) return;
  const v = (monthMap()[empId] || {})[day];
  const info = cellInfo(v, empId);
  const w = dow(ym.y, ym.m, day);
  const when = `${ym.m + 1}/${day}（${WD[w]}）`;
  const back = document.createElement('div');
  back.className = 'pop-back no-print';

  if (!info) {
    back.innerHTML = `<div class="pop"><h3>${esc(emp.name)}　${when}</h3>
      <p class="who">這天還沒排班。先用筆刷把班別排上去，再設定時間。</p>
      <div class="acts"><span style="flex:1"></span><button class="btn" data-x>知道了</button></div></div>`;
  } else {
    const dflt = hasT(info.shift) ? `班別預設 ${info.shift.start}–${info.shift.end}` : `班別預設 ${fmtH(info.shift.hours)} 小時`;
    const pers = (emp.times || {})[info.id];
    const from = info.from === 'cell' ? '目前是這天的例外時間' : (info.from === 'emp' ? '目前跟著個人固定時間' : '目前跟著班別預設');
    back.innerHTML = `<div class="pop">
      <h3>${esc(emp.name)}　${when}　${esc(info.shift.name)}</h3>
      <p class="who">${from}　·　${esc(dflt)}${pers ? `　·　個人固定 ${esc(pers.start + '–' + pers.end)}` : ''}</p>
      <div class="tl">
        <label>上班</label><input type="time" id="p-st" value="${esc(info.start)}">
        <label>下班</label><input type="time" id="p-en" value="${esc(info.end)}">
        <label>休息</label><input type="number" id="p-br" min="0" max="720" step="5" value="${info.brk}"><label>分</label>
      </div>
      <p class="calc">這天時數 <b id="p-h">${fmtH(info.hours)}</b> 小時<span id="p-warn" style="color:#B4232A"></span></p>
      <div class="acts">
        <button class="btn btn-solid" id="p-day">只改這天</button>
        <button class="btn" id="p-emp">設為個人固定</button>
        <button class="btn btn-quiet" id="p-clr">回到預設</button>
        <span style="flex:1"></span><button class="btn" data-x>取消</button>
      </div></div>`;
  }
  back.addEventListener('click', ev => { if (ev.target === back || ev.target.dataset.x !== undefined) closePop(); });
  document.body.appendChild(back);
  if (!info) return;

  const st = back.querySelector('#p-st'), en = back.querySelector('#p-en'), br = back.querySelector('#p-br');
  const vals = () => ({ st: normTime(st.value), en: normTime(en.value), br: Math.max(0, Math.min(720, +br.value || 0)) });
  const sync = () => {
    const v2 = vals();
    const ok = v2.st && v2.en;
    back.querySelector('#p-h').textContent = ok ? fmtH(spanHours(v2.st, v2.en, v2.br)) : fmtH(info.shift.hours);
    back.querySelector('#p-warn').textContent = ok ? '' : '　（上下班時間都要填）';
    back.querySelector('#p-day').disabled = !ok;
    back.querySelector('#p-emp').disabled = !ok;
  };
  [st, en, br].forEach(el => el.addEventListener('input', sync));
  sync();

  back.querySelector('#p-day').onclick = () => {
    setCell(empId, day, info.id, vals());
    closePop(); toast('已改這天的時間');
  };
  back.querySelector('#p-emp').onclick = () => {
    const v2 = vals();
    if (!emp.times) emp.times = {};
    emp.times[info.id] = { start: v2.st, end: v2.en, brk: v2.br };
    // 這個人這個班別的單日例外全部清掉，統一跟著個人固定時間
    Object.values(state.schedule).forEach(mm => {
      const row = mm[empId]; if (!row) return;
      Object.keys(row).forEach(k => { if (row[k] && typeof row[k] === 'object' && row[k].s === info.id) row[k] = info.id; });
    });
    save(); render(); if (cardEmp) renderCard();
    closePop(); toast(`${emp.name} 的${info.shift.name}固定為 ${v2.st}–${v2.en}`);
  };
  back.querySelector('#p-clr').onclick = () => {
    setCell(empId, day, info.id);
    closePop(); toast('已回到預設時間');
  };
}

/* ---------- 個人班表卡 ---------- */
let cardEmp = null, cardRef = null;
const empOf = id => state.employees.find(e => e.id === id);
const wageOf = emp => (emp && emp.wage != null && emp.wage !== '') ? +emp.wage : (+state.baseWage || 0);
const money = n => 'NT$ ' + Math.round(n).toLocaleString('en-US');

function cardStats(empId) {
  const row = monthMap()[empId] || {};
  const nd = daysIn(ym.y, ym.m);
  let days = 0, hours = 0;
  const per = {};
  for (let d = 1; d <= nd; d++) {
    const i = cellInfo(row[d], empId);
    if (!i) continue;
    per[i.id] = (per[i.id] || 0) + 1;
    if (i.shift.count !== false) { days++; hours += i.hours; }
  }
  return { days, hours: Math.round(hours * 100) / 100, per, row, nd };
}

function openCard(empId) {
  const emp = empOf(empId);
  if (!emp) return;
  const o = modal(`${esc(emp.name)}　個人班表`, '<div id="card-body"></div>',
    `<button class="btn" id="card-img">匯入對照圖</button>
     <label style="font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px">
       <input type="checkbox" id="card-pay"> 圖片含薪資</label>
     <button class="btn" id="card-jpg">下載 JPG</button>
     <span style="flex:1"></span><button class="btn btn-solid" data-close>完成</button>`);
  o.querySelector('.modal').classList.add('wide');
  // modal() 內部會先 closeModal()，所以卡片狀態要在建立之後才設
  cardEmp = empId; cardRef = null;
  o.addEventListener('click', ev => { if (ev.target === o || ev.target.dataset.close !== undefined) cardEmp = cardRef = null; });
  o.querySelector('#card-img').onclick = () => {
    const f = document.createElement('input');
    f.type = 'file'; f.accept = 'image/*';
    f.onchange = () => {
      const file = f.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => { cardRef = r.result; renderCard(); };
      r.readAsDataURL(file);
    };
    f.click();
  };
  o.querySelector('#card-jpg').onclick = () => downloadCardJPG(emp, o.querySelector('#card-pay').checked);
  renderCard();
}

function renderCard() {
  const box = document.querySelector('#card-body');
  if (!box || !cardEmp) return;
  const emp = empOf(cardEmp);
  if (!emp) { closeModal(); cardEmp = null; return; }
  const { days, hours, per, row, nd } = cardStats(cardEmp);
  const wage = wageOf(emp);

  let cal = '<div class="cal">' + WD.map(w => `<div class="hd">${w}</div>`).join('');
  const lead = dow(ym.y, ym.m, 1);
  for (let i = 0; i < lead; i++) cal += '<div class="dy pad"></div>';
  for (let d = 1; d <= nd; d++) {
    const i = cellInfo(row[d], cardEmp);
    const w = dow(ym.y, ym.m, d);
    const tm = i
      ? `<span class="tm${i.from === 'cell' ? ' ov' : ''}" data-tm title="點這裡設定這天的上下班時間">${i.start ? esc(i.start + '–' + i.end) : fmtH(i.hours) + ' 小時'}</span>`
      : '<span class="tm">&nbsp;</span>';
    cal += `<button class="dy${w === 0 || w === 6 ? ' wk' : ''}" data-cd="${d}"><span class="n">${d}</span>` +
      (i ? `<span class="cd" style="background:${esc(i.shift.color)};color:${textOn(i.shift.color)}">${esc(i.shift.code)}</span>` : '<span class="cd">&nbsp;</span>') +
      tm + '</button>';
  }
  cal += '</div>';

  const brushes = '<div class="card-brush"><span class="lbl">筆刷</span>' +
    state.shifts.map(s => `<button class="chip" data-cb="${s.id}" aria-pressed="${brush === s.id}">
      <span class="sw" style="background:${esc(s.color)};color:${textOn(s.color)}">${esc(s.code)}</span>${esc(s.name)}</button>`).join('') +
    `<button class="chip" data-cb="erase" aria-pressed="${brush === 'erase'}"><span class="sw" style="background:#fff">✕</span>清除</button></div>`;

  const perTxt = state.shifts.filter(s => per[s.id]).map(s =>
    `<span><i class="fi" style="background:${esc(s.color)}"></i>${esc(s.name)} ${per[s.id]} 天</span>`).join('') || '<span style="color:var(--muted)">尚未排班</span>';

  box.innerHTML = `<div class="card-cols">
      <div class="card-cal">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${ym.y} 年 ${ym.m + 1} 月${emp.note ? '　' + esc(emp.note) : ''}</div>
        ${brushes}${cal}
        <div class="stats"><span>出勤 <b>${days}</b> 天</span><span>總時數 <b>${fmtH(hours)}</b> 小時</span></div>
        <div class="legend" style="margin-top:8px">${perTxt}</div>
        <div class="pay">
          <div class="ln"><label style="font-size:12px;color:var(--muted)">時薪</label>
            <input type="number" id="card-wage" min="0" max="10000" step="1" value="${emp.wage != null && emp.wage !== '' ? emp.wage : ''}" placeholder="${+state.baseWage || 0}">
            <span style="font-size:12px;color:var(--muted)">× ${fmtH(hours)} 小時</span>
            <span class="amt">${money(hours * wage)}</span></div>
          <p class="note">時薪留空就套用基本時薪 ${money(+state.baseWage || 0)}／小時（在「員工」視窗設定）。${emp.wage != null && emp.wage !== '' ? '目前使用個人時薪。' : ''}</p>
        </div>
        ${empTimesHTML(emp)}
      </div>
      ${cardRef ? `<div class="card-ref"><img src="${cardRef}" alt="對照圖">
        <p class="hint">對照這張圖，在左邊月曆點日期修改班別（例如沒出席的改成休假）。圖片只在這次開啟時顯示，不會被儲存。</p></div>` : ''}
    </div>`;

  box.querySelectorAll('[data-cb]').forEach(b => b.onclick = () => {
    const v = b.dataset.cb;
    brush = brush === v ? null : v;
    renderPalette(); renderCard();
  });
  box.querySelectorAll('[data-cd]').forEach(b => b.onclick = ev => {
    const d = +b.dataset.cd;
    // 點日期下方的時間列 → 改時間，不塗班別
    if (ev.target.closest('[data-tm]')) { openTimePop(cardEmp, d); return; }
    if (!brush) { toast('先選一個班別當筆刷'); return; }
    const cur = cellId((monthMap()[cardEmp] || {})[d]);
    // 點到已是同一個班別 → 清除，方便快速槓掉
    setCell(cardEmp, d, (brush === 'erase' || cur === brush) ? null : brush);
  });
  const wi = box.querySelector('#card-wage');
  wi.oninput = () => {
    emp.wage = wi.value === '' ? null : Math.max(0, Math.min(10000, +wi.value || 0));
    save();
    box.querySelector('.amt').textContent = money(hours * wageOf(emp));
  };
  bindEmpTimes(box, emp);
}

/* 個人固定時間：這個人排某個班別時，預設用自己的上下班時間 */
function empTimesHTML(emp) {
  const t = emp.times || {};
  const rows = state.shifts.map(s => {
    const p = t[s.id] || {};
    const dflt = hasT(s) ? `${s.start}–${s.end}` : `${fmtH(s.hours)} 小時`;
    return `<div class="er" data-sid="${s.id}">
      <span class="nm2"><i class="fi" style="background:${esc(s.color)}"></i>${esc(s.name)}</span>
      <input type="time" data-t="start" value="${esc(p.start || '')}">
      <input type="time" data-t="end" value="${esc(p.end || '')}">
      <input type="number" data-t="brk" min="0" max="720" step="5" value="${p.brk || 0}" title="休息分鐘"><span style="color:var(--muted)">分休息</span>
      <span style="margin-left:auto;color:var(--muted)">${hasT(p) ? fmtH(spanHours(p.start, p.end, p.brk)) + ' 小時' : '預設 ' + esc(dflt)}</span>
    </div>`;
  }).join('');
  return `<details class="emp-times"${Object.keys(t).length ? ' open' : ''}>
    <summary>個人固定時間（${Object.keys(t).length ? '已設定 ' + Object.keys(t).length + ' 個班別' : '未設定，跟著班別預設'}）</summary>
    ${rows}
    <p class="hint2">填了就是這個人排該班別時的固定上下班時間，每個月都適用。留空代表跟著「班別」設定走。單一天要不一樣，點月曆格子裡的時間。</p>
  </details>`;
}
function bindEmpTimes(box, emp) {
  box.querySelectorAll('.emp-times .er').forEach(r => {
    const sid = r.dataset.sid;
    r.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
      const g = k => r.querySelector(`[data-t="${k}"]`).value;
      const start = normTime(g('start')), end = normTime(g('end'));
      if (!emp.times) emp.times = {};
      if (start && end) emp.times[sid] = { start, end, brk: Math.max(0, Math.min(720, +g('brk') || 0)) };
      else delete emp.times[sid];
      save(); render(); renderCard();
    }));
  });
}

/* 手繪 canvas 產生 JPG，維持單檔零依賴 */
function downloadCardJPG(emp, withPay) {
  const { days, hours, per, row, nd } = cardStats(emp.id);
  const wage = wageOf(emp);
  const S = 2, W = 720, CW = 96, CH = 74, PAD = 24;
  const calTop = 150;
  const lead = dow(ym.y, ym.m, 1);
  const rows = Math.ceil((lead + nd) / 7);
  const statsTop = calTop + 26 + rows * CH + 18;
  const H = statsTop + 40 + (withPay ? 54 : 0) + 16;

  const cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  const x = cv.getContext('2d');
  x.scale(S, S);
  const font = (sz, w) => `${w || 400} ${sz}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);

  x.fillStyle = '#151A21'; x.font = font(24, 700);
  x.fillText(emp.name, PAD, 44);
  x.font = font(14); x.fillStyle = '#6C7480';
  const sub = [state.unit, emp.note].filter(Boolean).join('　');
  if (sub) x.fillText(sub, PAD + x.measureText(emp.name).width + 220, 44);
  x.fillStyle = '#26418F'; x.font = font(18, 600);
  x.fillText(`${ym.y} 年 ${ym.m + 1} 月 班表`, PAD, 76);
  x.strokeStyle = '#E3E5E9'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(PAD, 92); x.lineTo(W - PAD, 92); x.stroke();

  x.font = font(12); x.fillStyle = '#6C7480';
  let lx = PAD;
  state.shifts.filter(s => per[s.id]).forEach(s => {
    x.fillStyle = s.color; x.fillRect(lx, 108, 11, 11);
    x.strokeStyle = 'rgba(0,0,0,.15)'; x.strokeRect(lx + .5, 108.5, 10, 10);
    x.fillStyle = '#3C4450'; x.font = font(12);
    const t = `${s.name} ${per[s.id]} 天`;
    x.fillText(t, lx + 16, 118);
    lx += 16 + x.measureText(t).width + 18;
  });

  x.font = font(12, 600); x.fillStyle = '#6C7480'; x.textAlign = 'center';
  WD.forEach((w, i) => x.fillText(w, PAD + i * CW + CW / 2, calTop + 14));
  for (let d = 1; d <= nd; d++) {
    const idx = lead + d - 1, cx = PAD + (idx % 7) * CW, cy = calTop + 26 + Math.floor(idx / 7) * CH;
    x.strokeStyle = '#E3E5E9'; x.strokeRect(cx + .5, cy + .5, CW - 4, CH - 4);
    const w = dow(ym.y, ym.m, d);
    x.textAlign = 'left'; x.font = font(11);
    x.fillStyle = (w === 0 || w === 6) ? '#B4232A' : '#6C7480';
    x.fillText(String(d), cx + 6, cy + 16);
    const i = cellInfo(row[d], emp.id);
    if (i) {
      const bw = CW - 16, mid = cx + 6 + bw / 2;
      x.fillStyle = i.shift.color; x.fillRect(cx + 6, cy + 20, bw, 26);
      x.fillStyle = textOn(i.shift.color); x.font = font(14, 700); x.textAlign = 'center';
      x.fillText(i.shift.code, mid, cy + 38);
      // 實際上下班時間，員工最需要看的就是這行
      const t = i.start ? i.start + '–' + i.end : (i.hours ? fmtH(i.hours) + ' 小時' : '');
      if (t) {
        x.fillStyle = '#3C4450'; x.font = font(9.5);
        x.fillText(t, mid, cy + 60);
      }
      x.textAlign = 'left';
    }
  }

  x.textAlign = 'left';
  x.strokeStyle = '#E3E5E9';
  x.beginPath(); x.moveTo(PAD, statsTop); x.lineTo(W - PAD, statsTop); x.stroke();
  x.fillStyle = '#151A21'; x.font = font(15, 600);
  x.fillText(`出勤 ${days} 天`, PAD, statsTop + 26);
  x.fillText(`總時數 ${fmtH(hours)} 小時`, PAD + 140, statsTop + 26);
  if (withPay) {
    x.fillStyle = '#F7F8FA'; x.fillRect(PAD, statsTop + 40, W - PAD * 2, 44);
    x.strokeStyle = '#E3E5E9'; x.strokeRect(PAD + .5, statsTop + 40.5, W - PAD * 2 - 1, 43);
    x.fillStyle = '#6C7480'; x.font = font(13);
    x.fillText(`時薪 ${money(wage)} × ${fmtH(hours)} 小時`, PAD + 12, statsTop + 68);
    x.fillStyle = '#26418F'; x.font = font(20, 700); x.textAlign = 'right';
    x.fillText(money(hours * wage), W - PAD - 12, statsTop + 70);
    x.textAlign = 'left';
  }

  const a = document.createElement('a');
  a.href = cv.toDataURL('image/jpeg', .92);
  a.download = `班表-${emp.name}-${ym.y}${String(ym.m + 1).padStart(2, '0')}.jpg`;
  a.click();
  toast('已下載個人班表圖片');
}

function openStaff() {
  const rows = state.employees.map((e, i) => `<div class="row" data-i="${i}">
      <span class="idx">${i + 1}</span>
      <input type="text" class="grow" value="${esc(e.name)}" placeholder="姓名" data-f="name">
      <input type="text" style="width:110px" value="${esc(e.note || '')}" placeholder="職務／備註" data-f="note">
      <button class="mini" data-mv="-1" title="上移">↑</button>
      <button class="mini" data-mv="1" title="下移">↓</button>
      <button class="mini danger" data-del title="刪除">✕</button>
    </div>`).join('') || '<p style="color:var(--muted);font-size:13px;margin:0">名單是空的，用下面的欄位一次貼上。</p>';

  const wageBox = `<div class="row" style="border-bottom:1px solid var(--rule);padding-bottom:9px;margin-bottom:6px">
      <label style="font-size:12px;color:var(--ink-soft);font-weight:600">基本時薪</label>
      <input type="number" id="base-wage" min="0" max="10000" step="1" value="${+state.baseWage || 0}" style="width:92px">
      <span style="font-size:12px;color:var(--muted)">元／小時，個人可在班表卡另外調整</span>
    </div>`;

  const o = modal('員工', wageBox + rows + `<div class="field">
      <h3>批次新增</h3><p>一行一個姓名，貼上後按「加入名單」。</p>
      <textarea id="bulk" placeholder="王小明&#10;陳美惠&#10;林志豪"></textarea>
    </div>`, `<button class="btn" id="bulk-add">加入名單</button>
       <span style="flex:1"></span><button class="btn btn-solid" data-close>完成</button>`);
  o.querySelector('#base-wage').oninput = ev => {
    state.baseWage = Math.max(0, Math.min(10000, +ev.target.value || 0));
    save(); if (cardEmp) renderCard();
  };

  o.querySelectorAll('.row[data-i]').forEach(r => {
    const i = +r.dataset.i;
    r.querySelectorAll('input').forEach(inp => inp.oninput = () => {
      state.employees[i][inp.dataset.f] = inp.value; save(); render();
    });
    r.querySelector('[data-del]').onclick = () => {
      if (!confirm(`刪除「${state.employees[i].name}」？該員工所有月份的班別會一併移除。`)) return;
      const id = state.employees[i].id;
      state.employees.splice(i, 1);
      Object.values(state.schedule).forEach(mm => delete mm[id]);
      save(); render(); openStaff();
    };
    r.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
      const j = i + (+b.dataset.mv);
      if (j < 0 || j >= state.employees.length) return;
      const [x] = state.employees.splice(i, 1);
      state.employees.splice(j, 0, x);
      save(); render(); openStaff();
    });
  });
  o.querySelector('#bulk-add').onclick = () => {
    const names = o.querySelector('#bulk').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!names.length) return;
    names.forEach(n => state.employees.push({ id: uid(), name: n, note: '', wage: null, times: {} }));
    save(); render(); openStaff();
  };
}

function openShifts() {
  const rows = state.shifts.map((s, i) => `<div class="row sh" data-i="${i}">
      <input type="color" value="${esc(s.color)}" data-f="color">
      <input type="text" class="code" maxlength="2" value="${esc(s.code)}" data-f="code" title="格子裡顯示的字">
      <input type="text" class="grow" value="${esc(s.name)}" placeholder="班別名稱" data-f="name">
      <label><input type="checkbox" ${s.count !== false ? 'checked' : ''} data-f="count">計入出勤</label>
      <button class="mini danger" data-del title="刪除">✕</button>
      <span class="tg">上班<input type="time" data-f="start" value="${esc(s.start || '')}">
        下班<input type="time" data-f="end" value="${esc(s.end || '')}">
        休息<input type="number" min="0" max="720" step="5" value="${s.brk || 0}" data-f="brk">分
        <span class="hv" data-hv>= ${fmtH(s.hours)} 小時</span>
        <input type="number" min="0" max="24" step="0.5" value="${+s.hours || 0}" data-f="hours" title="直接填時數（沒填上下班時間時使用）"${hasT(s) ? ' style="display:none"' : ''}>
      </span>
    </div>`).join('');

  const o = modal('班別', rows + `<div class="field"><p>填了上下班時間，時數會自動算出來（跨夜班會自動加一天，休息分鐘不計薪）。時間留空就直接填時數。「計入出勤」沒勾的班別（例如休假）不會算進天數、時數與底部的每日出勤人數。</p>
      <p>每個人的上下班時間不一樣時：在個人班表卡設「個人固定時間」；只有某一天不同，就在主表雙擊那一格。</p></div>`,
    `<button class="btn" id="add-shift">新增班別</button><span style="flex:1"></span>
     <button class="btn btn-solid" data-close>完成</button>`);

  o.querySelectorAll('.row.sh').forEach(r => {
    const i = +r.dataset.i;
    r.querySelectorAll('input').forEach(inp => {
      // 文字類要即時反應，時間／數字／勾選等 change 時再處理，避免打到一半就重算
      const evName = (inp.type === 'text' || inp.type === 'color') ? 'input' : 'change';
      inp.addEventListener(evName, () => {
        const s = state.shifts[i], f = inp.dataset.f;
        if (f === 'count') s.count = inp.checked;
        else if (f === 'start' || f === 'end') s[f] = normTime(inp.value);
        else if (f === 'brk') s.brk = Math.max(0, Math.min(720, Math.round(+inp.value || 0)));
        else if (f === 'hours') s.hours = Math.max(0, Math.min(24, +inp.value || 0));
        else s[f] = inp.value;
        // 起訖都在就以時間為準；否則保留手填的時數
        if (hasT(s)) s.hours = spanHours(s.start, s.end, s.brk);
        const hv = r.querySelector('[data-hv]');
        if (hv) hv.textContent = '= ' + fmtH(s.hours) + ' 小時';
        const hi = r.querySelector('[data-f="hours"]');
        if (hi) { hi.style.display = hasT(s) ? 'none' : ''; if (hasT(s)) hi.value = fmtH(s.hours); }
        save(); render(); renderPalette(); if (cardEmp) renderCard();
      });
    });
    r.querySelector('[data-del]').onclick = () => {
      const s = state.shifts[i];
      if (!confirm(`刪除班別「${s.name}」？已排入的格子會被清空。`)) return;
      Object.values(state.schedule).forEach(mm => Object.values(mm).forEach(row =>
        Object.keys(row).forEach(d => { if (cellId(row[d]) === s.id) delete row[d]; })));
      state.employees.forEach(e => { if (e.times) delete e.times[s.id]; });
      if (brush === s.id) brush = null;
      state.shifts.splice(i, 1);
      if (!state.shifts.length) {
        state.shifts = seed().shifts;
        toast('至少要保留一個班別，已恢復預設班別');
      }
      save(); render(); renderPalette(); openShifts();
    };
  });
  o.querySelector('#add-shift').onclick = () => {
    state.shifts.push({ id: uid(), code: '新', name: '新班別', color: PRESET[state.shifts.length % PRESET.length], start: '', end: '', brk: 0, hours: 8, count: true });
    save(); render(); renderPalette(); openShifts();
  };
}
window.openStaff = openStaff;

/* ---------- toolbar ---------- */
function go(delta) {
  const d = new Date(ym.y, ym.m + delta, 1);
  ym = { y: d.getFullYear(), m: d.getMonth() };
  render();
}
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#today-btn').onclick = () => { const n = new Date(); ym = { y: n.getFullYear(), m: n.getMonth() }; render(); };
$('#open-staff').onclick = openStaff;
$('#open-shifts').onclick = openShifts;
$('#print').onclick = () => window.print();
$('#save-file').onclick = saveToFile;
$('#unit').oninput = e => { state.unit = e.target.value; save(); };
function applyZoom() {
  const z = ZOOMS.includes(+state.zoom) ? +state.zoom : 1;
  document.documentElement.dataset.zoom = z;
  $('#zoom').value = String(z);
}
$('#zoom').onchange = e => { state.zoom = +e.target.value; applyZoom(); save(); };
$('#copy-prev').onclick = () => {
  const prev = new Date(ym.y, ym.m - 1, 1);
  const src = state.schedule[mk(prev.getFullYear(), prev.getMonth())];
  if (!src || !Object.keys(src).length) { toast('上個月沒有班表可以套用'); return; }
  if (!confirm('把上個月的班表複製過來？本月已排的內容會被覆蓋。')) return;
  const nd = daysIn(ym.y, ym.m), dst = {};
  Object.entries(src).forEach(([e, row]) => {
    dst[e] = {};
    // 帶時間的格子要複製一份，否則兩個月會共用同一個物件，改一邊另一邊跟著變
    Object.entries(row).forEach(([d, s]) => { if (+d <= nd) dst[e][d] = (s && typeof s === 'object') ? { ...s } : s; });
  });
  state.schedule[mk(ym.y, ym.m)] = dst;
  save(); render(); toast('已套用上月班表，記得檢查月底日期');
};
/* ---------- help ---------- */
function openHelp() {
  const where = hasHost ? '這個對話' : '這台電腦的這個瀏覽器';
  const o = modal('使用說明', `
    <ol class="guide">
      <li><b>加入員工</b><span>按上方「員工」，在最下面的欄位一行一個姓名貼上，按「加入名單」。姓名旁可填職務或備註，會印在名字下方。用 ↑ ↓ 調整表上的排列順序。</span></li>
      <li><b>設定班別</b><span>按上方「班別」。左邊色塊決定格子顏色，接著是格子裡顯示的字（1–2 字）、班別全名。填上下班時間，時數會自動算出來——跨夜班（例如 22:00–06:00）會自動加一天，「休息」填的分鐘數不計薪，例如 09:00–18:00 休息 60 分就是 8 小時。不想用時間的話把時間留空，直接填時數也可以。休假、例假這類不算上班的，把「計入出勤」取消勾選。</span></li>
      <li><b>每個人時間不一樣</b><span>三層設定，只會採用最先成立的那一層：<b>單日例外</b>（在主表雙擊那一格，或在個人卡點日期下方的時間）只影響那一天，格子右上角會出現小角標；<b>個人固定時間</b>（個人卡下方「個人固定時間」）是那個人排該班別時每次都用的時間，每個月都適用；都沒設就用<b>班別預設</b>。在時間視窗按「設為個人固定」可以直接把這次填的時間變成那個人的固定時間。注意：用筆刷重新塗過的格子會回到預設時間。</span></li>
      <li><b>排班</b><span>在筆刷列選一個班別，在格子上點一下就填入。按住滑鼠左鍵拖曳可以一次填一整排，適合連上五天。填錯就按右鍵清除，或選「清除」筆刷再塗。</span></li>
      <li><b>看統計</b><span>右邊兩欄是每個人的出勤天數與時數，下面是每天的出勤人數，再往下每個班別各一列，看得到每天各班有幾個人、整月各班總人次。全部自動計算。</span></li>
      <li><b>個人班表卡與算錢</b><span>點表格左邊的姓名，會開啟那個人的月曆卡片。卡片裡可以直接排班（上面有同一組筆刷），跟主表是同一份資料，改哪邊另一邊都會跟著變。月底核對打卡時，沒出席的日子就在卡片裡改成休假，時數與金額立刻重算。時薪留空會套用「員工」視窗裡設定的基本時薪，個別員工也可以在卡片裡單獨填。</span></li>
      <li><b>發給員工</b><span>在個人卡按「下載 JPG」，會存成一張班表圖片可以傳給本人，每天的上下班時間都會印在上面。預設不含薪資，要對帳時勾「圖片含薪資」再下載。</span></li>
      <li><b>對照紙本核銷</b><span>在個人卡按「匯入對照圖」選一張照片（例如打叉的紙本班表），照片會顯示在月曆旁邊，照著它點日期修改就好。照片只在這次開啟時顯示，不會被存起來。</span></li>
      <li><b>下個月</b><span>用左上角 ‹ › 換月份。按「套用上月」可以把上個月整份複製過來再修改，比從空白排快得多。</span></li>
      <li><b>列印</b><span>按「列印班表」，版面已設定成 A4 橫式一頁。在列印對話框把「背景圖形」打開，班別顏色才會印出來。</span></li>
    </ol>
    <div class="field">
      <h3>鍵盤</h3>
      <table class="keys">
        <tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>切換到第 1–9 個班別筆刷</td></tr>
        <tr><td><kbd>0</kbd></td><td>切換成清除筆刷</td></tr>
        <tr><td>右鍵點格子</td><td>清除該格</td></tr>
        <tr><td>雙擊格子</td><td>設定那天的上下班時間</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>關閉視窗</td></tr>
      </table>
    </div>
    <div class="field">
      <h3>資料存在哪裡</h3>
      <p>所有內容自動儲存在${where}，不會傳到任何伺服器。換電腦、換瀏覽器或清除瀏覽資料後就看不到了，重要班表請先匯出備份，或直接列印存檔。</p>
      <p>把這個檔案存到自己電腦使用時，上方的「儲存檔案」會把目前的資料直接寫回 HTML 檔（Chrome、Edge 第一次會問要存成哪個檔，之後按一下就覆寫）。下面的「另存新版」則是每次都另存一份帶日期的檔案，可以留著當版本紀錄。</p>
    </div>`,
    `<button class="btn" id="export">匯出備份</button>
     <button class="btn" id="import">匯入備份</button>
     <button class="btn" id="save-as">另存新版 HTML</button>
     <span style="flex:1"></span>
     <button class="btn btn-quiet" id="reset">清除所有資料</button>`);
  o.querySelector('#save-as').onclick = async () => { await flushSave(); downloadHTML(); toast('已另存一份 HTML'); };

  o.querySelector('#export').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const n = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `班表備份-${n.getFullYear()}${String(n.getMonth() + 1).padStart(2, '0')}${String(n.getDate()).padStart(2, '0')}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  o.querySelector('#import').onclick = () => {
    const f = document.createElement('input');
    f.type = 'file'; f.accept = 'application/json,.json';
    f.onchange = () => {
      const file = f.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = normBackup(JSON.parse(r.result));
          if (!d) throw 0;
          if (!confirm('匯入會覆蓋目前的所有資料，確定嗎？')) return;
          state = d; brush = state.shifts[0]?.id || null;
          applyZoom(); save(); render(); renderPalette(); closeModal(); toast('已匯入備份');
        } catch (e) { toast('這個檔案讀不出來，請選擇本工具匯出的備份檔'); }
      };
      r.readAsText(file);
    };
    f.click();
  };
  o.querySelector('#reset').onclick = async () => {
    if (!confirm('清除所有員工、班別與班表？這個動作無法復原，建議先匯出備份。')) return;
    state = seed();
    try { await store.del(KEY); } catch (e) { }
    brush = state.shifts[0].id; applyZoom(); render(); renderPalette(); closeModal();
  };
}
$('#help').onclick = openHelp;
window.openShifts = openShifts;
window.openHelp = openHelp;

/* ---------- boot ---------- */
(async () => {
  const n = new Date();
  ym = { y: n.getFullYear(), m: n.getMonth() };
  // 檔案內嵌資料與瀏覽器儲存，取時間戳較新的那份
  const fromFile = normBackup(embeddedData());
  const fromStore = normBackup(await load());
  let src = '';
  if (fromFile && fromStore) {
    if (fromStore.savedAt > fromFile.savedAt) { state = fromStore; src = '這台瀏覽器有較新的資料，已載入瀏覽器版本'; }
    else { state = fromFile; src = '已載入檔案內建的資料'; }
  } else state = fromFile || fromStore || seed();
  brush = state.shifts[0] ? state.shifts[0].id : null;
  if (src) setTimeout(() => toast(src), 400);
  applyZoom();
  renderPalette();
  render();
})();
</script>
